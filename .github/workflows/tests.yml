name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check standard-library modules
        run: python -B -c "import ssl, sqlite3, tkinter"
      - name: Run offline unit tests
        run: python -B -m unittest discover -v
        # GUI tests must skip when Tk cannot create a window (headless Ubuntu).
