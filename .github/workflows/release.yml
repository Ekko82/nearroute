name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build versioned release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -B tools/build_release.py --tag "$RELEASE_TAG"
      - name: Upload draft assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/NearRoute-*-windows.zip dist/nearroute-update.json --draft --verify-tag --title "NearRoute $RELEASE_TAG" --notes-file RELEASE_NOTES.md --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false
